<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カメラPDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<title>カメラPDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 書類を台に並べて見直す、コピー機の原稿台のような一画面。写真は端末の外へ送らないのでWebフォントも読み込まない。 */
:root {
  --bed: #e4e9e8; --paper: #ffffff; --panel: #f6f8f7; --ink: #15211f; --muted: #52615e;
  --line: #c6d0ce; --accent: #0b5f5b; --on-accent: #ffffff; --accent-soft: #d3e6e3;
  --danger: #ab2f24; --mark: #e8b21c; --shadow: 0 1px 3px rgba(21, 33, 31, .22);
  --font: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bed: #111a19; --paper: #f4f6f5; --panel: #1b2624; --ink: #e8efed; --muted: #a2b2ae;
    --line: #34423f; --accent: #63c5bb; --on-accent: #08201e; --accent-soft: #1f3a37;
    --danger: #f08a7e; --mark: #e8b21c; --shadow: 0 1px 3px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bed: #111a19; --paper: #f4f6f5; --panel: #1b2624; --ink: #e8efed; --muted: #a2b2ae;
  --line: #34423f; --accent: #63c5bb; --on-accent: #08201e; --accent-soft: #1f3a37;
  --danger: #f08a7e; --mark: #e8b21c; --shadow: 0 1px 3px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img, canvas { max-width: 100%; }
body { margin: 0; background: var(--bed); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 190px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
header p { margin: 2px 0 14px; color: var(--muted); font-size: 13px; }

.empty { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 28px 16px; border: 1.5px dashed var(--line); border-radius: 6px; }
.empty .sheet { width: 112px; aspect-ratio: 210 / 297; background: var(--paper); box-shadow: var(--shadow); position: relative; display: grid; place-items: center; color: #52615e; font-size: 12px; font-variant-numeric: tabular-nums; }
.empty p { margin: 0; max-width: 30em; }

.pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); }
.page { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.thumb { position: relative; align-self: start; background: var(--paper); box-shadow: var(--shadow); line-height: 0; }
.thumb canvas { width: 100%; height: auto; display: block; }
.no { position: absolute; left: -4px; top: -4px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 3px; background: var(--mark); color: #15211f; font-size: 13px; font-weight: 700; line-height: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; align-content: start; }
.tools button { min-height: 42px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: transparent; font-size: 13px; }
.tools button:hover:not(:disabled) { background: var(--accent-soft); }
.tools button:disabled { opacity: .38; cursor: default; }
.tools button.del { color: var(--danger); }
.range { grid-column: 1 / -1; font-size: 12px; color: var(--muted); line-height: 1.5; }
.range.miss { color: var(--danger); font-weight: 700; }

.settings { margin-top: 16px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.settings label { display: grid; gap: 3px; font-size: 13px; font-weight: 700; min-width: 0; }
.settings select, .settings input { width: 100%; min-height: 42px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bed); font-size: 16px; font-weight: 400; min-width: 0; }
.settings .wide { grid-column: 1 / -1; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar .in { max-width: 860px; margin: 0 auto; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { min-height: 48px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.btn.main { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-visible + .btn { outline: 3px solid var(--mark); outline-offset: 2px; }

.result { scroll-margin-bottom: 170px; margin-top: 16px; padding: 14px; background: var(--accent-soft); border-radius: 6px; display: grid; gap: 10px; }
.result b { font-variant-numeric: tabular-nums; }
.result .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.result .btn { flex: 1 1 130px; }
.msg { min-height: 1.5em; margin: 0; font-size: 13px; color: var(--muted); }
.msg.err { color: var(--danger); font-weight: 700; }
.note { margin: 14px 0 0; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-radius: 6px; background: var(--ink); color: var(--bed); font-size: 14px; max-width: calc(100vw - 32px); }
.toast button { min-height: 36px; border: 0; background: transparent; color: var(--mark); font-weight: 700; }

.crop { position: fixed; inset: 0; z-index: 10; background: #0d1413; color: #f4f6f5; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
.crop h2 { margin: 0; font-size: 16px; }
.stage-box { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 22px; position: relative; }
.stage { position: relative; touch-action: none; user-select: none; line-height: 0; }
.stage canvas.photo { display: block; max-width: none; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.shade { fill: rgba(0, 0, 0, .55); fill-rule: evenodd; pointer-events: none; }
.outline { fill: transparent; stroke: #e8b21c; stroke-width: 2; cursor: move; }
.handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; touch-action: none; cursor: grab; }
.handle::after { content: ""; position: absolute; inset: 11px; background: #e8b21c; border: 2px solid #0d1413; border-radius: 50%; }
.loupe { position: absolute; left: 4px; top: 4px; width: 112px; height: 112px; border: 2px solid #e8b21c; border-radius: 50%; background: #0d1413; pointer-events: none; z-index: 2; }
.loupe.right { left: auto; right: 4px; }
.crop-note { margin: 0; font-size: 13px; color: #c8d3d0; min-height: 1.6em; }
.crop .row4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.crop .btn { color: #f4f6f5; border-color: #8ba19d; }
.crop .btn.main { background: #e8b21c; border-color: #e8b21c; color: #15211f; }
@media (prefers-reduced-motion: no-preference) { .page { transition: background .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>カメラPDF</h1>
    <p>撮った写真を、1つのPDFにまとめます。写真はこの端末の中だけで処理します。</p>
  </header>

  <div id="empty" class="empty">
    <div class="sheet" aria-hidden="true">A4<br>210×297</div>
    <p>下の「カメラで撮る」から始めてください。何枚でも続けて足せます。</p>
    <button id="sample" class="btn" type="button">見本の3ページで試す</button>
  </div>

  <ol id="pages" class="pages" hidden></ol>

  <section id="settings" class="settings" hidden aria-label="PDFの設定">
    <label>用紙
      <select id="paper">
        <option value="A4">A4</option>
        <option value="B5">B5</option>
        <option value="A5">A5</option>
        <option value="LETTER">レター</option>
        <option value="FIT">写真に合わせる</option>
      </select>
    </label>
    <label>余白
      <select id="margin">
        <option value="0">なし</option>
        <option value="5">5mm</option>
        <option value="10">10mm</option>
      </select>
    </label>
    <label>大きさ
      <select id="quality">
        <option value="normal">標準（おすすめ）</option>
        <option value="high">高画質（重くなる）</option>
        <option value="small">軽くする（メール向け）</option>
      </select>
    </label>
    <label>仕上がり
      <select id="finish">
        <option value="photo">写真のまま</option>
        <option value="doc">白黒くっきり（書類向け）</option>
      </select>
    </label>
    <label class="wide">ファイル名
      <input id="name" type="text" autocomplete="off" placeholder="空のときは撮った日時になります">
    </label>
  </section>

  <section id="result" class="result" hidden aria-live="polite">
    <div><b id="resultText"></b></div>
    <div class="acts">
      <button id="save" class="btn main" type="button">PDFを保存</button>
      <button id="share" class="btn" type="button" hidden>送る・共有</button>
    </div>
  </section>

  <p id="msg" class="msg" role="status"></p>
  <p class="note">見本の書類は架空のものです。登録も広告もありません。</p>
  <p id="installHint" class="note" hidden>ホーム画面に置くと、すぐ起動できます。iPhoneはSafariの共有ボタンから「ホーム画面に追加」、Androidはブラウザのメニューから「ホーム画面に追加」を選びます。</p>
</div>

<div class="bar">
  <div class="in">
    <div class="row">
      <input id="camera" class="file" type="file" accept="image/*" capture="environment" aria-label="カメラで撮る">
      <label for="camera" class="btn" id="cameraLabel">カメラで撮る</label>
      <input id="library" class="file" type="file" accept="image/*" multiple aria-label="写真から選ぶ">
      <label for="library" class="btn">写真から選ぶ</label>
    </div>
    <button id="make" class="btn main" type="button" disabled>PDFにする</button>
  </div>
</div>

<div id="toast" class="toast" hidden role="status"><span id="toastText"></span><button id="undo" type="button">元に戻す</button></div>

<div id="crop" class="crop" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
  <div>
    <h2 id="cropTitle">四すみの丸を、書類の角に合わせます</h2>
    <p id="cropNote" class="crop-note" role="status"></p>
  </div>
  <div class="stage-box" id="stageBox">
    <canvas id="loupe" class="loupe" width="224" height="224" hidden></canvas>
    <div class="stage" id="stage">
      <canvas id="cropCanvas" class="photo"></canvas>
      <svg id="overlay" aria-hidden="true"><path id="shade" class="shade"></path><polygon id="outline" class="outline" data-move="1"></polygon></svg>
      <span class="handle" data-i="0"></span><span class="handle" data-i="1"></span>
      <span class="handle" data-i="2"></span><span class="handle" data-i="3"></span>
    </div>
  </div>
  <div class="row4">
    <button id="cropAuto" class="btn" type="button">自動で選び直す</button>
    <button id="cropReset" class="btn" type="button">写真全体にする</button>
    <button id="cropCancel" class="btn" type="button">やめる</button>
    <button id="cropOk" class="btn main" type="button">決定</button>
  </div>
</div>

<script>// カメラPDFの計算処理。画面に依存しない部分をここに置く（node でも試験できる）。
(function (root) {
  const MM = 72 / 25.4;
  const PAPERS = {
    A4: [210, 297],
    A5: [148, 210],
    B5: [182, 257],
    LETTER: [215.9, 279.4],
  };
  const QUALITY = {
    high: { maxSide: 2400, jpeg: 0.9 },
    normal: { maxSide: 1700, jpeg: 0.8 },
    small: { maxSide: 1200, jpeg: 0.62 },
  };

  // 画像の向きに合わせて用紙を縦横にし、余白の内側に収まるように置く。単位はpt。
  function placeImage(imgW, imgH, paper, marginMm) {
    if (!(imgW > 0 && imgH > 0)) throw new Error("画像の大きさが正しくありません");
    const margin = (marginMm || 0) * MM;
    if (paper === "FIT") {
      const scale = (297 * MM) / Math.max(imgW, imgH);
      const w = imgW * scale;
      const h = imgH * scale;
      return { pageW: w + margin * 2, pageH: h + margin * 2, x: margin, y: margin, w, h };
    }
    const size = PAPERS[paper];
    if (!size) throw new Error("用紙サイズが正しくありません: " + paper);
    const landscape = imgW > imgH;
    const pageW = (landscape ? size[1] : size[0]) * MM;
    const pageH = (landscape ? size[0] : size[1]) * MM;
    const scale = Math.min((pageW - margin * 2) / imgW, (pageH - margin * 2) / imgH);
    const w = imgW * scale;
    const h = imgH * scale;
    return { pageW, pageH, x: (pageW - w) / 2, y: (pageH - h) / 2, w, h };
  }

  // 書類の範囲は四隅の点（0〜1の割合）で持つ。順番は左上・右上・右下・左下。
  const FULL_QUAD = [[0, 0], [1, 0], [1, 1], [0, 1]];

  function fullQuad() { return FULL_QUAD.map((p) => p.slice()); }

  // 範囲を、画像を右に90度回したあとの範囲に直す。
  function rotateQuadRight(q) {
    const r = (p) => [1 - p[1], p[0]];
    return [r(q[3]), r(q[0]), r(q[1]), r(q[2])];
  }

  // 四隅が縦横にそろった長方形なら、切り抜きの範囲を返す。斜めなら null。
  function quadToCrop(q) {
    const e = 1e-6;
    const same = Math.abs(q[0][1] - q[1][1]) < e && Math.abs(q[2][1] - q[3][1]) < e &&
      Math.abs(q[0][0] - q[3][0]) < e && Math.abs(q[1][0] - q[2][0]) < e;
    if (!same) return null;
    return { x: q[0][0], y: q[0][1], w: q[1][0] - q[0][0], h: q[3][1] - q[0][1] };
  }

  // 凸の四角形か（角をドラッグしたときに形が崩れないように確かめる）
  function isConvexQuad(q) {
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(cross) < 1e-9) return false;
      if (sign && Math.sign(cross) !== sign) return false;
      sign = Math.sign(cross);
    }
    return true;
  }

  // 斜めの範囲をまっすぐにしたときの大きさ。向かい合う辺の長いほうを使う。
  function quadOutput(rotW, rotH, q, maxSide) {
    const len = (a, b) => Math.hypot((a[0] - b[0]) * rotW, (a[1] - b[1]) * rotH);
    const w = Math.max(len(q[0], q[1]), len(q[3], q[2]));
    const h = Math.max(len(q[0], q[3]), len(q[1], q[2]));
    const scale = Math.min(1, maxSide / Math.max(w, h));
    return { scale, width: Math.max(1, Math.round(w * scale)), height: Math.max(1, Math.round(h * scale)) };
  }

  // 四角形の中身を長方形へ写す。src・dst はRGBAの配列、q はピクセル単位の四隅。
  function warpQuad(src, sw, sh, q, dst, dw, dh) {
    const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
    const dx1 = x1 - x2, dx2 = x3 - x2, sx = x0 - x1 + x2 - x3;
    const dy1 = y1 - y2, dy2 = y3 - y2, sy = y0 - y1 + y2 - y3;
    const den = dx1 * dy2 - dx2 * dy1;
    const g = (sx * dy2 - dx2 * sy) / den;
    const h = (dx1 * sy - sx * dy1) / den;
    const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3;
    const d = y1 - y0 + g * y1, e = y3 - y0 + h * y3;
    let out = 0;
    for (let j = 0; j < dh; j++) {
      const v = (j + 0.5) / dh;
      for (let i = 0; i < dw; i++) {
        const u = (i + 0.5) / dw;
        const w = g * u + h * v + 1;
        const px = Math.min(sw - 1.001, Math.max(0, (a * u + b * v + x0) / w - 0.5));
        const py = Math.min(sh - 1.001, Math.max(0, (d * u + e * v + y0) / w - 0.5));
        const ix = px | 0, iy = py | 0, fx = px - ix, fy = py - iy;
        const p00 = (iy * sw + ix) * 4, p10 = p00 + 4, p01 = p00 + sw * 4, p11 = p01 + 4;
        for (let c = 0; c < 3; c++) {
          const top = src[p00 + c] + (src[p10 + c] - src[p00 + c]) * fx;
          const bottom = src[p01 + c] + (src[p11 + c] - src[p01 + c]) * fx;
          dst[out + c] = top + (bottom - top) * fy;
        }
        dst[out + 3] = 255;
        out += 4;
      }
    }
  }

  // ---- 書類の範囲の自動検出 ----
  // 2通りの見つけ方（背景の色との違い／輪郭）で候補を作り、四角形らしいほうを選ぶ。見つからなければ null。

  function boxBlur(a, w, h) {
    const t = new Float32Array(a.length);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const l = a[y * w + Math.max(0, x - 1)], c = a[y * w + x], r = a[y * w + Math.min(w - 1, x + 1)];
        t[y * w + x] = (l + c + r) / 3;
      }
    }
    for (let y = 0; y < h; y++) {
      const up = Math.max(0, y - 1) * w, here = y * w, down = Math.min(h - 1, y + 1) * w;
      for (let x = 0; x < w; x++) a[here + x] = (t[up + x] + t[here + x] + t[down + x]) / 3;
    }
  }

  function median(values) {
    const s = Array.from(values).sort((p, q) => p - q);
    return s[s.length >> 1];
  }

  // 大津の方法：値を2つの群に分けるしきい値
  function otsu(values) {
    const hist = new Float64Array(256);
    for (let i = 0; i < values.length; i++) hist[Math.min(255, values[i] | 0)]++;
    let sum = 0;
    for (let v = 0; v < 256; v++) sum += v * hist[v];
    let bgN = 0, bgSum = 0, best = 0, bestT = 0;
    for (let v = 0; v < 256; v++) {
      bgN += hist[v];
      if (!bgN) continue;
      const fgN = values.length - bgN;
      if (!fgN) break;
      bgSum += v * hist[v];
      const diff = bgSum / bgN - (sum - bgSum) / fgN;
      const between = bgN * fgN * diff * diff;
      if (between > best) { best = between; bestT = v; }
    }
    return bestT;
  }

  // 外周から wall でない画素をたどり、たどり着けなかった部分を返す（穴埋め）
  function enclosed(wall, w, h) {
    const seen = new Uint8Array(w * h);
    const stack = new Int32Array(w * h);
    let top = 0;
    const push = (i) => { if (!wall[i] && !seen[i]) { seen[i] = 1; stack[top++] = i; } };
    for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
    for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
    while (top) {
      const i = stack[--top], x = i % w, y = (i - x) / w;
      if (x > 0) push(i - 1);
      if (x < w - 1) push(i + 1);
      if (y > 0) push(i - w);
      if (y < h - 1) push(i + w);
    }
    const out = new Uint8Array(w * h);
    for (let i = 0; i < out.length; i++) out[i] = seen[i] ? 0 : 1;
    return out;
  }

  function morph(mask, w, h, erode) {
    const out = new Uint8Array(mask.length);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        const l = x > 0 ? mask[i - 1] : 0, r = x < w - 1 ? mask[i + 1] : 0;
        const u = y > 0 ? mask[i - w] : 0, d = y < h - 1 ? mask[i + w] : 0;
        out[i] = erode ? (mask[i] && l && r && u && d ? 1 : 0) : (mask[i] || l || r || u || d ? 1 : 0);
      }
    }
    return out;
  }

  // 細いつながり（影や机の模様）を切る
  function openMask(mask, w, h, r) {
    let m = mask;
    for (let i = 0; i < r; i++) m = morph(m, w, h, true);
    for (let i = 0; i < r; i++) m = morph(m, w, h, false);
    return m;
  }

  function largestComponent(mask, w, h) {
    const label = new Int32Array(w * h);
    const stack = new Int32Array(w * h);
    let bestId = 0, bestArea = 0, id = 0;
    for (let s = 0; s < mask.length; s++) {
      if (!mask[s] || label[s]) continue;
      id++;
      let top = 0, area = 0;
      stack[top++] = s;
      label[s] = id;
      while (top) {
        const i = stack[--top], x = i % w, y = (i - x) / w;
        area++;
        const visit = (j) => { if (mask[j] && !label[j]) { label[j] = id; stack[top++] = j; } };
        if (x > 0) visit(i - 1);
        if (x < w - 1) visit(i + 1);
        if (y > 0) visit(i - w);
        if (y < h - 1) visit(i + w);
      }
      if (area > bestArea) { bestArea = area; bestId = id; }
    }
    return { label, id: bestId, area: bestArea };
  }

  function convexHull(points) {
    const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const half = (list) => {
      const out = [];
      for (const p of list) {
        while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) <= 0) out.pop();
        out.push(p);
      }
      out.pop();
      return out;
    };
    return half(pts).concat(half(pts.reverse()));
  }

  function polygonArea(q) {
    let s = 0;
    for (let i = 0; i < q.length; i++) {
      const a = q[i], b = q[(i + 1) % q.length];
      s += a[0] * b[1] - a[1] * b[0];
    }
    return Math.abs(s) / 2;
  }

  // 凸包の中で面積が最大に近い四角形を選ぶ
  function largestQuad(hull) {
    const pick = (f) => hull.reduce((best, p) => (f(p) > f(best) ? p : best), hull[0]);
    let q = [pick((p) => -p[0] - p[1]), pick((p) => p[0] - p[1]), pick((p) => p[0] + p[1]), pick((p) => p[1] - p[0])];
    for (let round = 0; round < 6; round++) {
      let changed = false;
      for (let i = 0; i < 4; i++) {
        let best = q[i], bestArea = polygonArea(q);
        for (const p of hull) {
          const trial = q.slice();
          trial[i] = p;
          const area = polygonArea(trial);
          if (area > bestArea + 1e-6) { bestArea = area; best = p; }

  // 左上から時計回りに並べる
  function orderQuad(q) {
    const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
    const sorted = q.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
    let first = 0, least = Infinity;
    sorted.forEach((p, i) => { const v = p[0] + p[1]; if (v < least) { least = v; first = i; } });

  // 各辺の近くの輪郭に直線を当てはめ、角を交点へ動かす（角の丸みや指の影響を減らす）
  function refineQuad(q, boundary, long) {
    const near = long * 0.03;
    const lines = q.map((a, i) => {
      const b = q[(i + 1) % 4];

      let n = 0, mx = 0, my = 0;

      for (const p of boundary) {

        const dist = Math.abs((p[0] - a[0]) * dy - (p[1] - a[1]) * dx) / len;

      const theta = Math.atan2(2 * sxy, sxx - syy) / 2;
      return { px: mx, py: my, dx: Math.cos(theta), dy: Math.sin(theta) };

      const l1 = lines[(i + 3) % 4], l2 = lines[i];

      if (Math.abs(den) < 1e-6) return corner;
      const t = ((l2.px - l1.px) * l2.dy - (l2.py - l1.py) * l2.dx) / den;
      const x = l1.px + t * l1.dx, y = l1.py + t * l1.dy;

  function quadFromMask(mask, w, h) {
    const long = Math.max(w, h);
    const comp = largestComponent(mask, w, h);
    if (comp.area < w * h * 0.1) return null;
    const inside = (x, y) => x >= 0 && y >= 0 && x < w && y < h && comp.label[y * w + x] === comp.id;
    const boundary = [];
    for (let y = 0; y < h; y++) {

        grad[i] = Math.min(255, Math.sqrt(sum) / 2);

    }
    const edgeT = Math.max(otsu(grad), 6);
    const edgeWall = new Uint8Array(n);
    for (let i = 0; i < n; i++) edgeWall[i] = grad[i] > edgeT ? 1 : 0;
    const closed = morph(edgeWall, w, h, false);

    const candidates = [];
    for (const [wall, r] of [[wallAt(Math.max(t, 14)), 2], [wallAt(Math.max(t * 0.45, 14)), 2], [closed, 3]]) {
      const found = quadFromMask(openMask(enclosed(wall, w, h), w, h, r), w, h);
      if (found) candidates.push(found);
    }
    if (!candidates.length) return null;
    // 紙の一部（濃い帯など）が背景に似ると狭い候補ができるので、きれいな四角形なら広いほうを優先する
    const clean = candidates.filter((c) => c.fill >= 0.92);
    const best = clean.length
      ? clean.reduce((a, b) => (b.frac > a.frac ? b : a))
      : candidates.reduce((a, b) => (b.score > a.score ? b : a));
    // ぼかしの分だけ外へ広がるので、机の色が縁に残らないよう少し内側へ寄せる
    const cx = best.q.reduce((s, p) => s + p[0], 0) / 4, cy = best.q.reduce((s, p) => s + p[1], 0) / 4;
    const inset = Math.max(w, h) * 0.012;
    return best.q.map((p) => {
      const k = 1 - inset / Math.hypot(p[0] - cx, p[1] - cy);
      return [Math.min(1, Math.max(0, (cx + (p[0] - cx) * k) / w)), Math.min(1, Math.max(0, (cy + (p[1] - cy) * k) / h))];

  // 白黒くっきり：明るさの分布から紙の白と文字の黒を見つけて伸ばす。RGBAの配列を直接書き換える。
  function enhanceDocument(rgba) {

    for (let v = 255; v >= 0; v--) { sum += hist[v]; if (sum >= n * 0.35) { high = v; break; } }
    if (high - low < 24) { low = Math.max(0, low - 12); high = Math.min(255, high + 12); }
    const range = Math.max(1, high - low);
    for (let i = 0; i < rgba.length; i += 4) {
      const g = (rgba[i] * 299 + rgba[i + 1] * 587 + rgba[i + 2] * 114) / 1000;
      const t = Math.min(1, Math.max(0, (g - low) / range));
      const out = Math.round(255 * t * t * (3 - 2 * t));
      rgba[i] = rgba[i + 1] = rgba[i + 2] = out;
    }
    return { low, high };
  }

  function readJpegInfo(b) {
    if (b[0] !== 0xff || b[1] !== 0xd8) throw new Error("JPEGではありません");
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xff) { i++; continue; }
      const m = b[i + 1];
      if (m === 0xff) { i++; continue; }
      if (m >= 0xc0 && m <= 0xcf && m !== 0xc4 && m !== 0xc8 && m !== 0xcc) {
        return {
          height: (b[i + 5] << 8) | b[i + 6],
          width: (b[i + 7] << 8) | b[i + 8],
          components: b[i + 9],
        };

      if (m === 0xd8 || (m >= 0xd0 && m <= 0xd7)) { i += 2; continue; }

    const firstId = (index) => 3 + index * 3;

<script>
(function () {
  const C = window.CameraPdf;
  const $ = (id) => document.getElementById(id);
  let pages = [];
  let nextId = 1;
  let pdf = null; // { bytes, filename }
  let downloads = null;
  let deleted = null;
  let toastTimer = null;

  // Claudeの画面内で開いたときは保存の機能を借りる。単体のWebアプリでは使わない。
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then((d) => { downloads = d; }).catch(() => {});
  }

  function say(text, isError) {
    $("msg").textContent = text || "";
    $("msg").className = isError ? "msg err" : "msg";
  }

  function loadImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("読めない画像")); };
      img.src = url;
    });
  }

  function makeCanvas(w, h) {
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = "high";
    return { canvas, ctx };
  }

  function drawRotated(ctx, page, rotW, rotH) {
    ctx.translate(rotW / 2, rotH / 2);
    ctx.rotate((page.rotation * Math.PI) / 180);
    ctx.drawImage(page.img, -page.img.naturalWidth / 2, -page.img.naturalHeight / 2);
  }

  function renderPage(page, maxSide, finish) {
    const img = page.img;
    const crop = C.quadToCrop(page.quad);
    let canvas, ctx;
    if (crop) {
      const s = C.outputSize(img.naturalWidth, img.naturalHeight, page.rotation, crop, maxSide);
      ({ canvas, ctx } = makeCanvas(s.width, s.height));
      ctx.scale(s.width / s.cropW, s.height / s.cropH);
      ctx.translate(-s.cropX, -s.cropY);
      drawRotated(ctx, page, s.rotW, s.rotH);
    } else {
      // 斜めの範囲：出力に合う大きさの写真から、長方形へ写す
      const turned = page.rotation % 180 !== 0;
      const rotW = turned ? img.naturalHeight : img.naturalWidth;
      const rotH = turned ? img.naturalWidth : img.naturalHeight;
      const out = C.quadOutput(rotW, rotH, page.quad, maxSide);
      // 写す元は少し大きめにして、細い文字がギザギザになるのを防ぐ
      const srcScale = Math.min(1, out.scale * 1.6);
      const sw = Math.max(2, Math.round(rotW * srcScale));
      const sh = Math.max(2, Math.round(rotH * srcScale));
      const src = makeCanvas(sw, sh);
      src.ctx.scale(sw / rotW, sh / rotH);
      drawRotated(src.ctx, page, rotW, rotH);
      const srcData = src.ctx.getImageData(0, 0, sw, sh);
      ({ canvas, ctx } = makeCanvas(out.width, out.height));
      const dst = ctx.createImageData(out.width, out.height);
      C.warpQuad(srcData.data, sw, sh, page.quad.map((p) => [p[0] * sw, p[1] * sh]), dst.data, out.width, out.height);
      ctx.putImageData(dst, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
    if (finish === "doc") {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const data = ctx.getImageData(0, 0, s.width, s.height);
      C.enhanceDocument(data.data);
      ctx.putImageData(data, 0, 0);
    }
    return canvas;
  }

  function clearResult() {
    pdf = null;
    $("result").hidden = true;
  }

  function draw() {
    const list = $("pages");
    list.textContent = "";
    pages.forEach((page, i) => {
      const li = document.createElement("li");
      li.className = "page";
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.appendChild(renderPage(page, 240, "photo"));
      const no = document.createElement("span");
      no.className = "no";
      no.textContent = i + 1;
      thumb.appendChild(no);
      const tools = document.createElement("div");
      tools.className = "tools";
      const add = (label, fn, opts) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.setAttribute("aria-label", (i + 1) + "ページ目を" + label);
        if (opts && opts.disabled) b.disabled = true;
        if (opts && opts.cls) b.className = opts.cls;
        b.addEventListener("click", fn);
        tools.appendChild(b);
      };
      add("前へ", () => move(i, -1), { disabled: i === 0 });
      add("後ろへ", () => move(i, 1), { disabled: i === pages.length - 1 });
      add("右に回す", () => rotate(page));
      add("範囲を直す", () => openCrop(page));
      add("削除", () => remove(i), { cls: "del" });
      const range = document.createElement("div");
      const miss = page.range === "miss";
      range.className = miss ? "range miss" : "range";
      range.textContent = miss ? "書類の範囲を見つけられませんでした。「範囲を直す」で選べます。" :
        page.range === "auto" ? "書類の範囲を自動で選びました。" :
        page.range === "manual" ? "自分で選んだ範囲です。" : "写真全体です。";
      tools.appendChild(range);
      li.append(thumb, tools);
      list.appendChild(li);
    });
    const has = pages.length > 0;
    $("empty").hidden = has;
    list.hidden = !has;
    $("settings").hidden = !has;
    $("make").disabled = !has;
    $("make").textContent = has ? pages.length + "ページをPDFにする" : "PDFにする";
    $("cameraLabel").textContent = has ? "カメラで足す" : "カメラで撮る";
  }

  function move(i, by) {
    const page = pages.splice(i, 1)[0];
    pages.splice(i + by, 0, page);
    clearResult();
    draw();
  }

  function rotate(page) {
    page.rotation = (page.rotation + 90) % 360;
    page.quad = C.rotateQuadRight(page.quad);
    clearResult();
    draw();
  }

  function remove(i) {
    if (deleted) URL.revokeObjectURL(deleted.page.url);
    deleted = { page: pages.splice(i, 1)[0], index: i };
    clearResult();
    draw();
    $("toastText").textContent = (i + 1) + "ページ目を削除しました";
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      $("toast").hidden = true;
      if (deleted) { URL.revokeObjectURL(deleted.page.url); deleted = null; }
    }, 7000);
  }

  $("undo").addEventListener("click", () => {
    if (!deleted) return;
    clearTimeout(toastTimer);
    pages.splice(deleted.index, 0, deleted.page);
    deleted = null;
    $("toast").hidden = true;
    clearResult();
    draw();
  });

  // 小さくした写真で書類の四隅を探す。回転後の向きで探すので、選び直しにも使える。
  function detectRange(page) {
    try {
      const whole = { img: page.img, rotation: page.rotation, quad: C.fullQuad() };
      const small = renderPage(whole, 320, "photo");
      const data = small.getContext("2d").getImageData(0, 0, small.width, small.height);
      return C.detectDocument(data.data, small.width, small.height);
    } catch (e) {
      return null;
    }
  }

  async function addBlobs(blobs) {
    let failed = 0;
    say("写真を読み込んでいます");
    for (const blob of blobs) {
      try {
        const { img, url } = await loadImage(blob);
        const page = { id: nextId++, img, url, rotation: 0, quad: C.fullQuad(), range: "miss" };
        const found = detectRange(page);
        if (found) { page.quad = found; page.range = "auto"; }
        pages.push(page);
      } catch (e) {
        failed++;
      }
    }
    clearResult();
    draw();
    say(failed ? failed + "枚は開けませんでした。JPEGかPNGの写真を選んでください。" : "", failed > 0);
  }

  for (const id of ["camera", "library"]) {
    $(id).addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = "";
      if (files.length) await addBlobs(files);
    });
  }
  for (const id of ["paper", "margin", "quality", "finish", "name"]) {
    $(id).addEventListener("change", clearResult);
  }

  // 架空の書類を描いて、撮った写真の代わりにする
  function sampleBlob(title, rows, tint, wide, tilt) {
    const w = wide ? 1400 : 1000;
    const h = wide ? 1000 : 1414;
    const c = document.createElement("canvas");
    c.width = wide ? 1800 : 1300;
    c.height = wide ? 1350 : 1750;
    const x = c.getContext("2d");
    x.fillStyle = "#3b4644"; x.fillRect(0, 0, c.width, c.height);
    x.translate(c.width / 2, c.height / 2);
    x.rotate((tilt * Math.PI) / 180);
    x.translate(-w / 2, -h / 2);
    x.fillStyle = tint; x.fillRect(0, 0, w, h);
    x.fillStyle = "#2b2b2b";
    x.font = "bold 56px sans-serif"; x.fillText(title, 80, 130);
    x.font = "30px sans-serif"; x.fillText("見本（架空の書類です）", 80, 190);
    x.font = "36px sans-serif";
    rows.forEach((r, i) => {
      const y = 300 + i * 90;
      x.fillText(r[0], 80, y);
      x.textAlign = "right"; x.fillText(r[1], w - 80, y); x.textAlign = "left";
      x.fillRect(80, y + 22, w - 160, 2);
    });
    return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.92));
  }
  $("sample").addEventListener("click", async () => {
    $("sample").disabled = true;
    say("見本を用意しています");
    const blobs = await Promise.all([
      sampleBlob("納品書", [["ノート 3冊", "1,200円"], ["ペン 5本", "750円"], ["封筒 20枚", "400円"], ["合計", "2,350円"]], "#efeee6", false, -5),
      sampleBlob("打ち合わせメモ", [["日時", "11月5日 10時"], ["場所", "第2会議室"], ["次回", "11月19日"]], "#e8eef0", false, 4),
      sampleBlob("横長の見取り図", [["入口", "左"], ["受付", "中央"]], "#f0ecea", true, 3),
    ]);
    await addBlobs(blobs);
    $("sample").disabled = false;
  });

  // PDFを作る
  function toJpeg(canvas, quality) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(async (blob) => {
        if (!blob) return reject(new Error("画像を作れませんでした"));
        resolve(new Uint8Array(await blob.arrayBuffer()));
      }, "image/jpeg", quality);
    });
  }

  $("make").addEventListener("click", async () => {
    const q = C.QUALITY[$("quality").value];
    const paper = $("paper").value;
    const marginMm = Number($("margin").value);
    const finish = $("finish").value;
    $("make").disabled = true;
    try {
      const out = [];
      for (let i = 0; i < pages.length; i++) {
        say((i + 1) + " / " + pages.length + " ページ目を作っています");
        await new Promise((r) => setTimeout(r));
        out.push({ jpeg: await toJpeg(renderPage(pages[i], q.maxSide, finish), q.jpeg), paper, marginMm });
      }
      const bytes = C.buildPdf(out);
      pdf = { bytes, filename: C.safeFilename($("name").value) };
      $("resultText").textContent = pdf.filename + "（" + pages.length + "ページ・" + C.formatBytes(bytes.length) + "）";
      $("result").hidden = false;
      $("share").hidden = !canShare();
      say("");
      $("result").scrollIntoView({ block: "nearest" });
    } catch (e) {
      say("PDFを作れませんでした。枚数を減らすか「軽くする」を選んでください。", true);
    } finally {
      $("make").disabled = pages.length === 0;
    }
  });

  function pdfFile() {
    return new File([pdf.bytes], pdf.filename, { type: "application/pdf" });
  }
  function canShare() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [pdfFile()] })); } catch (e) { return false; }
  }

  $("save").addEventListener("click", async () => {
    if (!pdf) return;
    if (downloads) {
      try {
        await downloads.save({ filename: pdf.filename, data: new Blob([pdf.bytes], { type: "application/pdf" }) });
        say("保存しました。");
      } catch (e) {
        if (e && e.code === "declined") say("保存をやめました。");
        else say("この画面では保存できませんでした。", true);
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([pdf.bytes], { type: "application/pdf" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = pdf.filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    say("保存しました。");
  });

  $("share").addEventListener("click", async () => {
    if (!pdf) return;
    try {
      await navigator.share({ files: [pdfFile()], title: pdf.filename });
    } catch (e) {
      if (!e || e.name !== "AbortError") say("送れませんでした。「PDFを保存」をお使いください。", true);
    }
  });

  // 範囲を直す画面。pts は表示上のピクセルで持ち、決定のときに割合へ戻す。
  let cropPage = null;
  let cropRange = "manual";
  let pts = null;
  let view = null;
  const handles = Array.from(document.querySelectorAll(".handle"));

  function placeRange() {
    const line = pts.map((p) => p[0] + "," + p[1]).join(" ");
    $("outline").setAttribute("points", line);
    const path = "M0 0H" + view.w + "V" + view.h + "H0Z M" + pts.map((p) => p[0] + " " + p[1]).join(" L") + "Z";
    $("shade").setAttribute("d", path);
    handles.forEach((h, i) => { h.style.left = pts[i][0] + "px"; h.style.top = pts[i][1] + "px"; });
  }

  function setRange(quad) {
    pts = quad.map((p) => [p[0] * view.w, p[1] * view.h]);
    placeRange();
  }

  function openCrop(page) {
    cropPage = page;
    cropRange = page.range;
    $("crop").hidden = false;
    $("cropNote").textContent = page.range === "miss" ? "自動では見つけられませんでした。丸を動かして選んでください。" : "";
    const box = $("stageBox");
    const style = getComputedStyle(box);
    const areaW = box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const areaH = box.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    const src = renderPage({ img: page.img, rotation: page.rotation, quad: C.fullQuad() }, 1400, "photo");
    const scale = Math.min(areaW / src.width, areaH / src.height);
    const canvas = $("cropCanvas");
    canvas.width = src.width;
    canvas.height = src.height;
    canvas.getContext("2d").drawImage(src, 0, 0);
    view = { w: Math.floor(src.width * scale), h: Math.floor(src.height * scale) };
    canvas.style.width = view.w + "px";
    canvas.style.height = view.h + "px";
    $("stage").style.width = view.w + "px";
    $("stage").style.height = view.h + "px";
    $("overlay").setAttribute("viewBox", "0 0 " + view.w + " " + view.h);
    setRange(page.quad);
    $("cropOk").focus();
  }
  function closeCrop() {
    $("crop").hidden = true;
    $("loupe").hidden = true;
    cropPage = null;
  }

  // 指で角が隠れるので、動かしている所を拡大して見せる
  function drawLoupe(p) {
    const lens = $("loupe");
    const photo = $("cropCanvas");
    const zoom = 3;
    const sx = photo.width / view.w;
    const half = 56 / zoom;
    lens.hidden = false;
    // 指と重ならないよう、左半分を触っているときは右に出す
    lens.classList.toggle("right", p[0] < view.w / 2);
    const ctx = lens.getContext("2d");
    ctx.fillStyle = "#0d1413";
    ctx.fillRect(0, 0, 224, 224);
    ctx.save();
    ctx.beginPath();
    ctx.arc(112, 112, 112, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(photo, (p[0] - half) * sx, (p[1] - half) * sx, half * 2 * sx, half * 2 * sx, 0, 0, 224, 224);
    ctx.strokeStyle = "#e8b21c";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(112, 84); ctx.lineTo(112, 140); ctx.moveTo(84, 112); ctx.lineTo(140, 112);
    ctx.stroke();
    ctx.restore();
  }

  let drag = null;
  $("stage").addEventListener("pointerdown", (e) => {
    const t = e.target;
    const corner = t.dataset && t.dataset.i !== undefined ? Number(t.dataset.i) : null;
    if (corner === null && !(t.dataset && t.dataset.move)) return;
    e.preventDefault();
    $("stage").setPointerCapture(e.pointerId);
    drag = { id: e.pointerId, corner, sx: e.clientX, sy: e.clientY, start: pts.map((p) => p.slice()) };
    if (corner !== null) drawLoupe(pts[corner]);
  });
  $("stage").addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    if (drag.corner === null) {
      const xs = drag.start.map((p) => p[0]), ys = drag.start.map((p) => p[1]);
      const mx = Math.min(view.w - Math.max(...xs), Math.max(-Math.min(...xs), dx));
      const my = Math.min(view.h - Math.max(...ys), Math.max(-Math.min(...ys), dy));
      pts = drag.start.map((p) => [p[0] + mx, p[1] + my]);
    } else {
      const next = pts.map((p) => p.slice());
      const from = drag.start[drag.corner];
      next[drag.corner] = [Math.min(view.w, Math.max(0, from[0] + dx)), Math.min(view.h, Math.max(0, from[1] + dy))];
      if (!C.isConvexQuad(next)) return; // ねじれる位置には動かさない
      pts = next;
      drawLoupe(pts[drag.corner]);
    }
    cropRange = "manual";
    $("cropNote").textContent = "";
    placeRange();
  });
  const endDrag = () => { drag = null; $("loupe").hidden = true; };
  $("stage").addEventListener("pointerup", endDrag);
  $("stage").addEventListener("pointercancel", endDrag);

  $("cropCancel").addEventListener("click", closeCrop);
  $("cropReset").addEventListener("click", () => {
    setRange(C.fullQuad());
    cropRange = "whole";
    $("cropNote").textContent = "";
  });
  $("cropAuto").addEventListener("click", () => {
    const found = detectRange(cropPage);
    if (found) {
      setRange(found);
      cropRange = "auto";
      $("cropNote").textContent = "書類の範囲を選び直しました。";
    } else {
      $("cropNote").textContent = "自動では見つけられませんでした。丸を動かして選んでください。";
    }
  });
  $("cropOk").addEventListener("click", () => {
    cropPage.quad = pts.map((p) => [p[0] / view.w, p[1] / view.h]);
    cropPage.range = cropRange;
    closeCrop();
    clearResult();
    draw();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("crop").hidden) closeCrop();
  });
  window.addEventListener("beforeunload", (e) => {
    if (pages.length) { e.preventDefault(); e.returnValue = ""; }
  });

  // 単体で公開したページをブラウザで開いているときだけ案内する
  const installed = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  $("installHint").hidden = installed || !document.querySelector('link[rel="manifest"]');

  draw();
  // 動作確認用
  window.cameraPdfTest = { addBlobs, getPdf: () => pdf, getPages: () => pages };
})();
</script>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
