name: 補助金データの更新
on:
  schedule:
    - cron: "0 21 * * *"  # 毎日 朝6時（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_hojokin.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hojokin.json
          git commit -m "補助金データの更新"
          git pull --rebase origin main
          git push
